name: Test, Build Windows EXE and Auto-Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run automated test suites
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_extest_v33.py tests/test_shuffler_invariants.py tests/test_cv7991_cv1239.py tests/test_db_fts5_migration.py tests/test_converters_mock.py -v
      - name: Inject license secret from GitHub Secret
        env:
          NGANHANGDE_LICENSE_SECRET: ${{ secrets.NGANHANGDE_LICENSE_SECRET }}
        shell: pwsh
        run: |
          if (-not $env:NGANHANGDE_LICENSE_SECRET) { Write-Error "Thieu GitHub Secret NGANHANGDE_LICENSE_SECRET"; exit 1 }
          python tools/set_license_secret.py inject
      - name: Switch to Paid Customer Build for Release
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('nganhangde/core/licensing.py'); p.write_text(p.read_text(encoding='utf-8').replace('AUTHOR_PRO_MODE = True','AUTHOR_PRO_MODE = False',1), encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('NganHangDe.spec'); p.write_text(p.read_text(encoding='utf-8').replace('name=\"Nganhangde_vu-pro\"','name=\"Nganhangde_vu\"'), encoding='utf-8')"
      - name: Build Windows bundle (--onedir)
        run: pyinstaller --noconfirm --clean NganHangDe.spec
      - name: Copy User Guide & Zip Windows Release
        shell: pwsh
        run: |
          Copy-Item HUONG_DAN_SU_DUNG.txt dist\Nganhangde_vu\HUONG_DAN_SU_DUNG.txt -Force
          Compress-Archive -Path dist\Nganhangde_vu\* -DestinationPath Nganhangde_vu-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Nganhangde_vu-Windows
          path: Nganhangde_vu-Windows.zip
      - name: Publish GitHub Release (for Auto-Updater)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Nganhangde_vu-Windows.zip
          generate_release_notes: true
